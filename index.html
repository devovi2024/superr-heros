<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SuperHero</title>
  <link rel="stylesheet" href="/src/main.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"
    integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g=="
    crossorigin="anonymous"
    referrerpolicy="no-referrer"
  />
</head>
<body>
  <div class="main-wrapper">
    <div class="app">
      <!-- App Header -->
      <div class="app-header">
        <h2 class="app-header-title">Super<span>Hero.</span></h2>
        <form class="app-header-search">
          <input
            type="text"
            class="form-control"
            placeholder="Search your superhero here ..."
            name="search"
          />
          <button type="submit" class="search-btn">
            <i class="fas fa-search"></i>
          </button>
          <div class="search-list" id="search-list"></div>
        </form>
      </div>
      <!-- End App Header -->

      <div class="app-body">
        <div class="app-body-content">
          <!-- Thumbnail -->
          <div class="app-body-content-thumbnail">
            <img src="images/thumbnail-batman.jpg" id="hero-image" />
          </div>

          <!-- Content List -->
          <div class="app-body-content-list">
            <div class="name" id="hero-name">Batman</div>

            <!-- Tabs -->
            <div class="app-body-tabs-head">
              <button type="button" class="tab-head-single" data-id="1">
                <span>powerstats</span>
              </button>
              <button type="button" class="tab-head-single" data-id="2">
                <span>biography</span>
              </button>
              <button type="button" class="tab-head-single" data-id="3">
                <span>appearance</span>
              </button>
              <button type="button" class="tab-head-single" data-id="4">
                <span>connections</span>
              </button>
            </div>

            <div class="app-body-tabs-body">
              <ul class="tab-body-single powerstats"></ul>
              <ul class="tab-body-single biography"></ul>
              <ul class="tab-body-single appearance"></ul>
              <ul class="tab-body-single connections"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./src/index.js"></script>
</body>
</html>
